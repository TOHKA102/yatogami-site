<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>这是独属于TOHKA的网站</title>
  
  <!-- 立即初始化主题，杜绝白屏与刷新闪烁 -->
  <script>
    (function() {
      const savedTheme = localStorage.getItem('tohka_theme') || 'dark';
      document.documentElement.setAttribute('data-theme', savedTheme);
    })();
  </script>

  <style>
    /* ========================================================
       1. CSS 变量与明暗主题系统
       ======================================================== */
    :root, [data-theme="dark"] {
      --bg-base: #0c0614;
      --text-main: #ffffff;
      --text-sub: #d6c7eb;
      --text-muted: #8e7a9e;
      --nav-bg: rgba(18, 9, 28, 0.78);
      --nav-border: rgba(255, 105, 180, 0.28);
      --overlay-bg: radial-gradient(circle at 50% 30%, rgba(12, 6, 20, 0.4) 0%, rgba(12, 6, 20, 0.92) 100%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 105, 180, 0.22);
      --box-bg: rgba(22, 10, 36, 0.85);
      --accent-pink: #ff69b4;
      --accent-glow: rgba(255, 105, 180, 0.45);
      --btn-pill-bg: rgba(255, 255, 255, 0.08);
      --btn-pill-text: #ffffff;
      --hero-grad: linear-gradient(135deg, #ffffff 30%, #ff69b4 100%);
      --bg-opacity: 0.75;
    }

    [data-theme="light"] {
      --bg-base: #fdf5f9;
      --text-main: #2b0f33;
      --text-sub: #5c3568;
      --text-muted: #91689d;
      --nav-bg: rgba(255, 243, 249, 0.88);
      --nav-border: rgba(255, 105, 180, 0.38);
      --overlay-bg: radial-gradient(circle at 50% 30%, rgba(253, 245, 249, 0.35) 0%, rgba(250, 235, 245, 0.9) 100%);
      --card-bg: rgba(255, 255, 255, 0.88);
      --card-border: rgba(255, 105, 180, 0.35);
      --box-bg: rgba(255, 255, 255, 0.92);
      --accent-pink: #d81b60;
      --accent-glow: rgba(216, 27, 96, 0.35);
      --btn-pill-bg: rgba(255, 255, 255, 0.95);
      --btn-pill-text: #2b0f33;
      --hero-grad: linear-gradient(135deg, #2b0f33 25%, #d81b60 100%);
      --bg-opacity: 0.65;
    }

    /* 全局基础重置 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
    }
    html {
      scroll-behavior: smooth;
      background-color: var(--bg-base);
    }
    body {
      min-height: 100vh;
      color: var(--text-main);
      background: transparent;
      position: relative;
    }

    /* ========================================================
       2. 背景渲染层
       ======================================================== */
    #bg-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: var(--bg-opacity);
      transition: background-image 0.6s ease-in-out, opacity 0.4s ease;
      z-index: 0;
      pointer-events: none;
    }
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: var(--overlay-bg);
      z-index: 1;
      pointer-events: none;
    }

    /* ========================================================
       3. 顶部导航
       ======================================================== */
    header {
      position: sticky;
      top: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 40px;
      background: var(--nav-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--nav-border);
      z-index: 100;
    }
    .logo {
      font-size: 1.55rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: var(--accent-pink);
      text-decoration: none;
      text-shadow: 0 0 10px var(--accent-glow);
    }
    .nav-actions {
      display: flex;
      align-items: center;
      gap: 22px;
    }
    nav a {
      color: var(--text-sub);
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
      transition: color 0.25s, text-shadow 0.25s;
    }
    nav a:hover {
      color: var(--accent-pink);
      text-shadow: 0 0 8px var(--accent-glow);
    }
