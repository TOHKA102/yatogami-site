<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TOHKA - 壁纸与个人空间</title>
  <style>
    /* 全局与暗色渐变重置 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    html {
      scroll-behavior: smooth;
    }
    body {
      min-height: 100vh;
      color: #fff;
      background-color: #0d0614;
      background-size: cover;
      background-position: center;
      background-attachment: fixed;
      background-repeat: no-repeat;
      transition: background-image 0.5s ease-in-out;
      overflow-x: hidden;
    }

    /* 遮罩层：防止背景图片太亮导致文字看不清 */
    .bg-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, rgba(13, 6, 20, 0.6) 0%, rgba(20, 10, 35, 0.8) 100%);
      z-index: -1;
    }

    /* 顶部导航栏 */
    header {
      position: sticky;
      top: 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px 40px;
      background: rgba(20, 10, 30, 0.65);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border-bottom: 1px solid rgba(255, 105, 180, 0.2);
      z-index: 100;
    }
    .logo {
      font-size: 1.6rem;
      font-weight: 800;
      letter-spacing: 2px;
      color: #ff69b4;
      text-decoration: none;
      text-shadow: 0 0 10px rgba(255, 105, 180, 0.6);
    }
    nav a {
      color: #e0d0f0;
      text-decoration: none;
      margin-left: 28px;
      font-size: 0.95rem;
      transition: color 0.3s, text-shadow 0.3s;
    }
    nav a:hover, nav a.active {
      color: #ff77a9;
      text-shadow: 0 0 8px rgba(255, 119, 169, 0.6);
    }

    /* 首屏展示区 (Hero) */
    .hero {
      min-height: calc(100vh - 75px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 0 20px;
    }
    .hero h1 {
      font-size: 4.5rem;
      letter-spacing: 4px;
      background: linear-gradient(135deg, #fff 30%, #ff69b4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 18px;
      filter: drop-shadow(0 4px 15px rgba(255, 105, 180, 0.3));
    }
    .hero p {
      font-size: 1.15rem;
      color: #d1c4e9;
      max-width: 650px;
      line-height: 1.8;
      margin-bottom: 35px;
    }
    .btn-explore {
      display: inline-block;
      padding: 14px 38px;
      font-size: 1rem;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(135deg, #8a2be2, #ff69b4);
      border: none;
      border-radius: 30px;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 20px rgba(255, 105, 180, 0.4);
      transition: transform 0.25s, box-shadow 0.25s;
    }
    .btn-explore:hover {
      transform: translateY(-3px);
      box-shadow: 0 6px 25px rgba(255, 105, 180, 0.6);
    }

    /* 画廊板块 */
    .section-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 80px 20px;
    }
    .section-title {
      text-align: center;
      font-size: 2.2rem;
      margin-bottom: 45px;
      color: #fff;
      text-shadow: 0 0 12px rgba(255, 105, 180, 0.4);
    }
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 30px;
    }
    .gallery-card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 105, 180, 0.2);
      border-radius: 16px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.3s ease, border-color 0.3s;
    }
    .gallery-card:hover {
      transform: translateY(-6px);
      border-color: rgba(255, 105, 180, 0.6);
    }
    .gallery-card img {
      width: 100%;
      height: 240px;
      object-fit: cover;
      display: block;
      transition: transform 0.4s ease;
    }
    .gallery-card:hover img {
      transform: scale(1.04);
    }
    .card-info {
      padding: 16px;
      text-align: center;
      color: #e0d0f0;
      font-size: 1rem;
      font-weight: 500;
    }

    /* 关于小窝板块 */
    .about-box {
      background: rgba(25, 12, 38, 0.75);
      border: 1px solid rgba(255, 105, 180, 0.25);
      border-radius: 20px;
      padding: 45px 35px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }
    .about-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 25px;
      margin-bottom: 30px;
    }
    .about-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 22px;
    }
    .about-card h3 {
      font-size: 1.2rem;
      color: #ff77a9;
      margin-bottom: 12px;
    }
    .about-card ul {
      list-style: none;
      line-height: 2;
      font-size: 0.95rem;
      color: #d1c4e9;
    }
    .about-statement {
      background: rgba(255, 255, 255, 0.02);
      border-left: 4px solid #ff69b4;
      padding: 20px;
      border-radius: 8px;
      line-height: 1.8;
      color: #e0d0f0;
      font-size: 0.95rem;
    }

    /* 全屏放大图片弹窗 (Lightbox) */
    #lightbox {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(5, 2, 10, 0.9);
      backdrop-filter: blur(8px);
      z-index: 9999;
      justify-content: center;
      align-items: center;
      cursor: zoom-out;
    }
    #lightbox img {
      max-width: 90%;
      max-height: 90%;
      border-radius: 10px;
      box-shadow: 0 0 30px rgba(255, 105, 180, 0.4);
    }

    /* 底部版权 */
    footer {
      text-align: center;
      padding: 40px 20px;
      color: #8a7a9a;
      font-size: 0.85rem;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
  </style>
</head>
<body>

  <!-- 1. 背景半透明遮罩 -->
  <div class="bg-overlay"></div>

  <!-- 2. 顶部导航栏 -->
  <header>
    <a href="#home" class="logo">TOHKA</a>
    <nav>
      <a href="#home">首页</a>
      <a href="#gallery">壁纸画廊</a>
      <a href="#about">关于小窝</a>
    </nav>
  </header>

  <!-- 3. 主视觉区域 (Hero) -->
  <main>
    <section id="home" class="hero">
      <h1>TOHKA</h1>
      <p>夜刀神十香与二次元美学空间。记录灵感、收集壁纸与数字创意。</p>
      <a href="#gallery" class="btn-explore">探索壁纸</a>
    </section>

    <!-- 4. 画廊展示板块 (引用 1.jpg, 2.jpg, 3.jpg) -->
    <section id="gallery" class="section-container">
      <h2 class="section-title">🌸 精选壁纸画廊</h2>
      <div class="gallery-grid">
        
        <!-- 壁纸 1 -->
        <div class="gallery-card" onclick="openLightbox(this)">
          <img src="assets/images/wallpapers/1.jpg" alt="TOHKA Wallpaper 01">
          <div class="card-info">夜刀神十香 · 壁纸 01</div>
        </div>

        <!-- 壁纸 2 -->
        <div class="gallery-card" onclick="openLightbox(this)">
          <img src="assets/images/wallpapers/2.jpg" alt="TOHKA Wallpaper 02">
          <div class="card-info">夜刀神十香 · 壁纸 02</div>
        </div>

        <!-- 壁纸 3 -->
        <div class="gallery-card" onclick="openLightbox(this)">
          <img src="assets/images/wallpapers/3.jpg" alt="TOHKA Wallpaper 03">
          <div
